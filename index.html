<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Pro Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // သင်၏ ကိုယ်ပိုင် Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDxbrWG3bQTqFiKNZ_8rLvMPeOOj3PTWJI",
            authDomain: "the-one-community-a3a50.firebaseapp.com",
            projectId: "the-one-community-a3a50",
            storageBucket: "the-one-community-a3a50.firebasestorage.app",
            messagingSenderId: "935304206770",
            appId: "1:935304206770:web:66386d8e818f4625b1acab",
            measurementId: "G-MN34Y0XN8J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const appId = 'the-one-community-v1';

        window.state = {
            isAdmin: false,
            user: null,
            teams: Array.from({length: 36}, (_, i) => ({ id: i, name: "" })), 
            rounds: [],
            currentRound: 1,
            activeTab: 'rounds',
            isLeagueStarted: false,
            potr: {} 
        };

        // Firebase path သတ်မှတ်ချက်
        const getTournamentDoc = () => doc(db, 'tournaments', appId);

        const saveToCloud = async (overrideData = null) => {
            if (!window.state.user || !window.state.isAdmin) return;
            try {
                const dataToSave = overrideData || {
                    teams: window.state.teams,
                    rounds: window.state.rounds,
                    isLeagueStarted: window.state.isLeagueStarted,
                    potr: window.state.potr,
                    currentRound: window.state.currentRound
                };
                await setDoc(getTournamentDoc(), dataToSave, { merge: true });
            } catch (e) { 
                console.error("Save Error:", e);
                showToast("Data သိမ်းမရပါ (Rules ကို Publish လုပ်ပါ)");
            }
        };

        const startSync = async () => {
            const statusDot = document.getElementById('cloud-status-dot');
            const statusText = document.getElementById('cloud-status-text');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.state.user = user;
                    
                    // Firestore မှ Data များကို အချိန်နှင့်တပြေးညီ ရယူခြင်း
                    onSnapshot(getTournamentDoc(), (docSnap) => {
                        if (statusDot) statusDot.classList.replace('bg-zinc-600', 'bg-emerald-500');
                        if (statusText) statusText.innerText = "Cloud Sync Active";

                        if (docSnap.exists()) {
                            const cloudData = docSnap.data();
                            if (cloudData.teams) window.state.teams = cloudData.teams;
                            if (cloudData.rounds) window.state.rounds = cloudData.rounds;
                            if (cloudData.isLeagueStarted !== undefined) window.state.isLeagueStarted = cloudData.isLeagueStarted;
                            if (cloudData.potr) window.state.potr = cloudData.potr;
                            if (cloudData.currentRound) window.state.currentRound = cloudData.currentRound;
                            refreshUI();
                        }
                    }, (error) => {
                        console.error("Sync Error:", error);
                        if (statusDot) {
                            statusDot.classList.remove('bg-zinc-600', 'bg-emerald-500');
                            statusDot.classList.add('bg-red-500');
                        }
                        if (statusText) statusText.innerText = "Permission Error";
                    });
                }
            });

            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Auth Error:", err);
            }
        };

        const showToast = (msg) => {
            const toast = document.createElement('div');
            toast.className = "fixed top-4 left-1/2 -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-full text-[10px] font-bold z-[200] shadow-xl";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        startSync();

        // UI Functions
        window.updateTeam = (id, name) => {
            const team = window.state.teams.find(t => t.id === id);
            if (team) {
                team.name = name;
                saveToCloud(); 
            }
        };

        window.generateFixtures = () => {
            if (!confirm("ပွဲစဉ်ဇယားအသစ် ပြန်လည်ရေးဆွဲမလား?")) return;
            const n = window.state.teams.length;
            const t = window.state.teams.map(x => x.id);
            let rounds = [];
            for (let r = 0; r < 8; r++) {
                let m = [];
                for (let i = 0; i < n / 2; i++) {
                    m.push({ h: t[i], a: t[n-1-i], hs: null, as: null });
                }
                rounds.push({ round: r + 1, matches: m });
                t.splice(1, 0, t.pop());
            }
            window.state.rounds = rounds;
            window.state.isLeagueStarted = true;
            window.state.currentRound = 1;
            saveToCloud();
            refreshUI();
        };

        window.updateScore = (rIdx, mIdx, side, val) => {
            const v = (val === "" || val === null) ? null : parseInt(val);
            window.state.rounds[rIdx].matches[mIdx][side ? 'hs' : 'as'] = v;
            saveToCloud();
            refreshUI();
        };

        window.getDigitColor = (s1, s2) => {
            if (s1 === null || s2 === null) return 'text-zinc-500'; 
            const val1 = parseInt(s1); const val2 = parseInt(s2);
            if (val1 > val2) return 'text-emerald-500'; 
            if (val1 < val2) return 'text-red-500';     
            return 'text-yellow-500';                  
        };

        window.refreshUI = () => {
            const tab = window.state.activeTab;
            renderNav();
            renderHeader();
            const container = document.getElementById('content');
            if(tab === 'setup') renderSetup(container);
            else if(tab === 'rounds') renderRounds(container);
            else if(tab === 'standing') renderTable(container);
            else if(tab === 'potr') renderPOTR(container);
            document.getElementById('loader').style.display = 'none';
        };

        const renderNav = () => {
            const tabs = ['rounds', 'standing', 'potr', 'setup'];
            const labels = ['League', 'Table', 'POTR', 'Settings'];
            document.getElementById('nav-bar').innerHTML = tabs.map((t, i) => {
                if (t === 'setup' && !window.state.isAdmin) return '';
                return `
                <button onclick="changeTab('${t}')" class="flex flex-col items-center gap-1 flex-1 transition-all ${window.state.activeTab === t ? 'text-red-500 scale-110' : 'text-zinc-500'}">
                    <span class="text-[8px] font-bold uppercase tracking-widest">${labels[i]}</span>
                    <div class="w-1 h-1 rounded-full ${window.state.activeTab === t ? 'bg-red-500' : 'bg-transparent'}"></div>
                </button>`;
            }).join('');
        };

        const renderHeader = () => {
            const adminStatus = document.getElementById('admin-status-container');
            if (window.state.isAdmin) {
                adminStatus.innerHTML = `<button onclick="logoutAdmin()" class="px-3 py-1 bg-red-600/10 text-red-500 text-[8px] font-black rounded-full border border-red-500/20 uppercase">Admin: Active</button>`;
            } else {
                adminStatus.innerHTML = `<button onclick="adminLogin()" class="px-3 py-1 bg-white/5 text-zinc-400 text-[8px] font-black rounded-full border border-white/5 uppercase">Login</button>`;
            }
        };

        const renderSetup = (container) => {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-zinc-900/40 p-5 rounded-3xl border border-white/5">
                        <h3 class="text-[10px] font-black uppercase text-red-500 tracking-widest mb-6">Managers</h3>
                        <div class="grid grid-cols-1 gap-2 max-h-[50vh] overflow-y-auto pr-2 custom-scroll">
                            ${window.state.teams.map(t => `
                                <div class="flex items-center gap-3 bg-black/40 p-2 rounded-xl border border-white/5">
                                    <span class="text-[9px] w-6 text-center font-black opacity-30">${t.id+1}</span>
                                    <input type="text" placeholder="Manager Name..." value="${t.name || ''}" 
                                        onblur="updateTeam(${t.id}, this.value)" 
                                        class="flex-1 bg-transparent text-sm font-bold text-white outline-none">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <button onclick="generateFixtures()" class="w-full py-5 bg-red-600 rounded-2xl font-black text-[11px] uppercase tracking-widest">Generate League Fixtures</button>
                </div>
            `;
        };

        const renderRounds = (container) => {
            if(!window.state.isLeagueStarted) {
                container.innerHTML = `<div class="py-20 text-center opacity-40 italic text-sm">League Stage Not Started</div>`;
                return;
            }
            const rIdx = window.state.currentRound - 1;
            const r = window.state.rounds[rIdx];
            
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6 bg-zinc-900/50 p-2 rounded-2xl border border-white/5">
                    <button onclick="moveRound(-1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10">←</button>
                    <div class="text-center">
                        <h2 class="text-[10px] font-black uppercase text-red-500 tracking-widest">Matchday</h2>
                        <span class="text-lg font-black">${window.state.currentRound}</span>
                    </div>
                    <button onclick="moveRound(1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10">→</button>
                </div>
                <div class="space-y-3">
                    ${r.matches.map((m, i) => {
                        const hT = window.state.teams.find(t => t.id === m.h) || { name: 'TBA' };
                        const aT = window.state.teams.find(t => t.id === m.a) || { name: 'TBA' };
                        return `
                        <div class="bg-zinc-900/40 p-4 rounded-2xl border border-white/5 flex items-center gap-3">
                            <div class="flex-1 text-right font-bold text-xs truncate">${hT.name || 'Manager '+(hT.id+1)}</div>
                            <div class="flex gap-1.5 items-center">
                                <input type="number" value="${m.hs !== null ? m.hs : ''}" onchange="updateScore(${rIdx}, ${i}, true, this.value)" ${!window.state.isAdmin?'readonly':''} 
                                    class="w-10 h-10 bg-black rounded-lg text-center font-black border border-white/10 ${getDigitColor(m.hs, m.as)}">
                                <span class="opacity-20 text-[8px] font-black">VS</span>
                                <input type="number" value="${m.as !== null ? m.as : ''}" onchange="updateScore(${rIdx}, ${i}, false, this.value)" ${!window.state.isAdmin?'readonly':''} 
                                    class="w-10 h-10 bg-black rounded-lg text-center font-black border border-white/10 ${getDigitColor(m.as, m.hs)}">
                            </div>
                            <div class="flex-1 text-left font-bold text-xs truncate">${aT.name || 'Manager '+(aT.id+1)}</div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        };

        const renderTable = (container) => {
            if(!window.state.isLeagueStarted) { container.innerHTML = `<p class="p-10 text-center opacity-40 italic">Waiting for League Start</p>`; return; }
            
            let statsMap = {};
            window.state.teams.forEach(t => statsMap[t.id] = { id: t.id, name: t.name || `Manager ${t.id+1}`, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 });
            window.state.rounds.forEach(r => {
                r.matches.forEach(m => {
                    if(m.hs !== null && m.as !== null) {
                        const h = statsMap[m.h], a = statsMap[m.a];
                        h.p++; a.p++; h.gf += m.hs; h.ga += m.as; a.gf += m.as; a.ga += m.hs;
                        if(m.hs > m.as) { h.w++; h.pts += 3; a.l++; }
                        else if(m.as > m.hs) { a.w++; a.pts += 3; h.l++; }
                        else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
                        h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
                    }
                });
            });
            const stats = Object.values(statsMap).sort((a,b) => b.pts - a.pts || b.gd - a.gd);

            container.innerHTML = `
                <div class="bg-zinc-900/40 rounded-3xl border border-white/5 overflow-x-auto">
                    <table class="w-full text-left min-w-[350px]">
                        <thead>
                            <tr class="text-[8px] uppercase font-black text-zinc-500 border-b border-white/5 bg-white/[0.02]">
                                <th class="p-4 pl-6">Manager</th>
                                <th class="p-4 text-center">P</th>
                                <th class="p-4 text-center">GD</th>
                                <th class="p-4 text-center">PTS</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stats.map((s,i) => `
                                <tr class="border-b border-white/[0.02] ${i < 8 ? 'bg-red-500/[0.03]' : ''}">
                                    <td class="p-4 pl-6 flex items-center gap-3">
                                        <span class="text-[9px] font-black ${i < 8 ? 'text-red-500' : 'opacity-20'}">${i+1}</span>
                                        <span class="text-xs font-bold text-zinc-200 truncate max-w-[100px]">${s.name}</span>
                                    </td>
                                    <td class="p-4 text-center text-zinc-400 text-[10px]">${s.p}</td>
                                    <td class="p-4 text-center font-bold text-[10px] ${s.gd>0?'text-emerald-500':'text-red-400'}">${s.gd}</td>
                                    <td class="p-4 text-center font-black text-red-500 text-sm">${s.pts}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        };

        const renderPOTR = (container) => {
            const rd = window.state.potr[window.state.currentRound] || { name: 'TBA', gf: 0, ga: 0 };
            container.innerHTML = `
                <div class="bg-zinc-900/80 p-8 rounded-[2.5rem] border border-white/5 text-center shadow-2xl">
                    <h3 class="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-8">Matchday ${window.state.currentRound} Player</h3>
                    <div class="w-32 h-32 mx-auto mb-6 rounded-full bg-zinc-800 flex items-center justify-center text-3xl border-4 border-red-600/20">👤</div>
                    <h4 class="text-2xl font-black text-white mb-6">${rd.name}</h4>
                    <div class="flex justify-center gap-8">
                        <div><div class="text-[8px] font-black text-zinc-500">GOALS</div><div class="text-xl font-black text-red-500">${rd.gf}</div></div>
                        <div><div class="text-[8px] font-black text-zinc-500">CONCEDED</div><div class="text-xl font-black text-blue-500">${rd.ga}</div></div>
                    </div>
                </div>
            `;
        };

        window.changeTab = t => { window.state.activeTab = t; refreshUI(); };
        window.moveRound = d => { 
            const n = window.state.currentRound + d; 
            if(n > 0 && n <= 8) { window.state.currentRound = n; refreshUI(); } 
        };
        window.adminLogin = () => { if(prompt("Admin Password?") === "1234") { window.state.isAdmin = true; refreshUI(); } };
        window.logoutAdmin = () => { window.state.isAdmin = false; window.state.activeTab = 'rounds'; refreshUI(); };
        window.onload = refreshUI;
    </script>
    <style>
        body { background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .glass-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen border-x border-white/5 relative">
    <div class="px-6 py-8 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div id="cloud-status-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-600 transition-colors duration-500"></div>
            <div id="cloud-status-text" class="text-[9px] font-black uppercase tracking-[0.2em] text-zinc-500">Connecting...</div>
        </div>
        <div id="admin-status-container"></div>
    </div>
    <header class="px-6 mb-8"><h1 class="text-4xl font-extrabold tracking-tighter italic leading-none">THE ONE<br><span class="text-red-600">COMMUNITY</span></h1></header>
    <main id="content" class="px-4 pb-32"></main>
    <div class="fixed bottom-6 left-4 right-4 h-20 glass-nav rounded-[2rem] flex items-center px-4 z-50 border border-white/5">
        <div id="nav-bar" class="flex w-full items-center justify-around"></div>
    </div>
    <div id="loader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center">
        <div class="w-10 h-1 flex gap-1"><div class="flex-1 bg-red-600 animate-bounce"></div><div class="flex-1 bg-red-600 animate-bounce" style="animation-delay: 0.1s"></div></div>
    </div>
</body>
</html>
